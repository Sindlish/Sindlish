[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sindlish"
description = "Sindlish is a localized high-level programming language. It is inspired by Python and it is in roman sindhi."
readme = "README.md"
requires-python = ">=3.13"
dynamic = ["version"]
dependencies = [
    "prompt-toolkit>=3.0.52",
    "rich>=15.0.0",
]

[project.scripts]
sindlish = "interpreter.cli:main"

# Version is read from interpreter/__init__.py (single source of truth).
[tool.hatch.version]
path = "interpreter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["interpreter"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pyinstaller",
    "ruff>=0.16.4",
    "pillow>=12.2.0",
]

[tool.ruff]
line-length = 99
