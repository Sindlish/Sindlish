[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sindlish"
description = "Sindlish is a localized high-level programming language. It is inspired by Python and it is in roman sindhi."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Amanat Ali Panhwer" },
]
license = "GPL-3.0-or-later"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Interpreters",
]
dynamic = ["version"]
dependencies = [
    "prompt-toolkit>=3.0.52",
    "rich>=15.0.0",
]

[project.scripts]
sindlish = "interpreter.cli:main"

[project.urls]
Homepage = "https://github.com/AmanatAliPanhwer/Sindlish"
Repository = "https://github.com/AmanatAliPanhwer/Sindlish.git"
Documentation = "https://github.com/AmanatAliPanhwer/Sindlish/tree/main/book"
Issues = "https://github.com/AmanatAliPanhwer/Sindlish/issues"

# Version is read from interpreter/__init__.py (single source of truth).
[tool.hatch.version]
path = "interpreter/__init__.py"

[tool.hatch.metadata]
license-files = ["LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["interpreter"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pyinstaller",
    "ruff>=0.16.4",
    "pillow>=12.2.0",
]

[tool.ruff]
line-length = 99
