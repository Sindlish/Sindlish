name: Build Executables
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: sindlish-linux
          - os: windows-latest
            artifact_name: sindlish-windows
          - os: macos-latest
            artifact_name: sindlish-macos
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --all-groups
      - name: Generate Icons
        run: uv run python tools/generate_icons.py
      - name: Build with PyInstaller
        run: uv run pyinstaller --noconfirm sindlish.spec
      - name: Build Windows Installer (Inno Setup)
        if: matrix.os == 'windows-latest'
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
        shell: powershell
      - name: Build macOS .pkg Installer
        if: matrix.os == 'macos-latest'
        run: |
          VERSION=$(uv run python -c "import interpreter; print(interpreter.__version__)")
          mkdir -p pkg_root/usr/local/lib/sindlish pkg_root/usr/local/bin
          cp -R dist/sindlish/ pkg_root/usr/local/lib/sindlish/
          printf '#!/bin/sh\nexec /usr/local/lib/sindlish/sindlish "$@"\n' > pkg_root/usr/local/bin/sindlish
          chmod +x pkg_root/usr/local/bin/sindlish pkg_root/usr/local/lib/sindlish/sindlish
          pkgbuild --identifier com.sindlish.cli --version "$VERSION" --install-location / --root pkg_root dist/sindlish-installer-macos.pkg
      - name: Build Linux .deb Package
        if: matrix.os == 'ubuntu-latest'
        run: |
          VERSION=$(uv run python -c "import interpreter; print(interpreter.__version__)")
          mkdir -p deb_root/usr/local/lib/sindlish deb_root/usr/local/bin
          mkdir -p deb_root/usr/share/icons/hicolor/512x512/apps
          mkdir -p deb_root/DEBIAN
          cp -r dist/sindlish/. deb_root/usr/local/lib/sindlish/
          cp tools/sindlish_icon.png deb_root/usr/share/icons/hicolor/512x512/apps/sindlish.png
          printf '#!/bin/sh\nexec /usr/local/lib/sindlish/sindlish "$@"\n' > deb_root/usr/local/bin/sindlish
          chmod +x deb_root/usr/local/bin/sindlish deb_root/usr/local/lib/sindlish/sindlish
          echo "Package: sindlish" > deb_root/DEBIAN/control
          echo "Version: $VERSION" >> deb_root/DEBIAN/control
          echo "Section: utils" >> deb_root/DEBIAN/control
          echo "Priority: optional" >> deb_root/DEBIAN/control
          echo "Architecture: amd64" >> deb_root/DEBIAN/control
          echo "Maintainer: Sindlish Team" >> deb_root/DEBIAN/control
          echo "Icon: /usr/share/icons/hicolor/512x512/apps/sindlish.png" >> deb_root/DEBIAN/control
          echo "Description: Sindlish programming language interpreter" >> deb_root/DEBIAN/control
          dpkg-deb --build deb_root dist/sindlish-installer-linux.deb
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/sindlish*

  release:
    name: Upload to Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
