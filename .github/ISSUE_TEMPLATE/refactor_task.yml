name: 🔧 Refactor task
description: One focused refactor step (structure/readability/perf) — no behavior changes
labels: ["refactor"]
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What exactly moves/changes? Files and symbols.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Bullet list of checkable outcomes (tests, book chapter, milestone checkbox).
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: Ground rules acknowledged
      options:
        - label: Tests green before & after; one commit-sized step
        - label: No behavior change mixed in (that's a separate bug/refactor issue)
        - label: Golden bytecode snapshots regenerated if opcodes/encoding changed